receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'field-sales-backend'
          static_configs:
            - targets: ['localhost:8000']
          metrics_path: '/metrics'

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  attributes:
    actions:
      - key: service.name
        value: field-sales-command
        action: upsert
      - key: environment
        value: production
        action: upsert
      - key: region
        value: us-east-1
        action: upsert

  resource_detection:
    detectors: [env, system]
    timeout: 2s
    override: false

  sampling:
    sampling_percentage: 100

exporters:
  otlp:
    endpoint: ${OTLP_EXPORTER_ENDPOINT}
    headers:
      Authorization: Bearer ${GRAFANA_CLOUD_TOKEN}

  logging:
    loglevel: debug

  jaeger:
    endpoint: ${JAEGER_ENDPOINT}

  prometheus:
    endpoint: "0.0.0.0:8888"
    namespace: field_sales
    const_labels:
      service: field-sales-command
      environment: production

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes, resource_detection, batch]
      exporters: [otlp, jaeger, logging]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, attributes, resource_detection, batch]
      exporters: [otlp, prometheus, logging]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes, resource_detection, batch]
      exporters: [otlp, logging]

  telemetry:
    logs:
      level: info
