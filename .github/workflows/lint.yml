name: Lint & Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pylint black isort

      - name: Install Node dependencies
        run: npm ci

      - name: Run Black formatter check (Python)
        run: black --check src tests

      - name: Run isort import sorter check (Python)
        run: isort --check-only src tests

      - name: Run flake8 linter (Python)
        run: |
          flake8 src tests \
            --max-line-length=100 \
            --extend-ignore=E203,W503,E501 \
            --statistics

      - name: Run mypy type checker (Python)
        run: |
          mypy src \
            --ignore-missing-imports \
            --no-implicit-optional \
            --warn-unused-ignores

      - name: Run pylint (Python)
        run: |
          pylint src \
            --disable=missing-docstring \
            --disable=too-few-public-methods \
            --fail-under=7.0 || true

      - name: Run ESLint (TypeScript/JavaScript)
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript type checker
        run: npm run type-check

      - name: Run Prettier formatter check
        run: npm run format:check
        continue-on-error: true

      - name: Check for security vulnerabilities
        run: |
          npm audit --audit-level=moderate || true

      - name: Run Bandit security check (Python)
        run: |
          pip install bandit
          bandit -r src -f json -o bandit-report.json || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Comment with linting results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Code Quality Check\n\n✅ Linting checks completed. See logs for details.'
            });
