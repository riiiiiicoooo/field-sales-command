version: '3.8'

services:
  # PostgreSQL database for Supabase
  postgres:
    image: postgres:15-alpine
    container_name: fsc_postgres
    environment:
      POSTGRES_DB: field_sales_command
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fsc_network

  # Supabase (self-hosted)
  supabase:
    image: supabase/postgres:15-1.41.4
    container_name: fsc_supabase
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXPIRATION: 3600
    ports:
      - "54321:5432"
    depends_on:
      - postgres
    networks:
      - fsc_network

  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fsc_backend
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "
    environment:
      FASTAPI_ENV: development
      FASTAPI_DEBUG: "true"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/field_sales_command
      REDIS_URL: redis://redis:6379/0
      SUPABASE_URL: http://supabase:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./backend/logs:/app/logs
    networks:
      - fsc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache & session store
  redis:
    image: redis:7-alpine
    container_name: fsc_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fsc_network

  # n8n workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: fsc_n8n
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: development
      GENERIC_TIMEZONE: UTC
      DATABASE_TYPE: postgresql
      DATABASE_POSTGRESDB_DATABASE: n8n
      DATABASE_POSTGRESDB_HOST: postgres
      DATABASE_POSTGRESDB_USER: postgres
      DATABASE_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POSTGRESDB_PORT: 5432
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/n8n/custom
    depends_on:
      - postgres
    networks:
      - fsc_network

  # OpenTelemetry Collector (optional, for observability)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: fsc_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
    volumes:
      - ./docker/otel-collector-config.yml:/etc/otel-collector-config.yml
    networks:
      - fsc_network

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: fsc_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - fsc_network

  # Grafana for dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: fsc_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fsc_network

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  prometheus_data:
  grafana_data:

networks:
  fsc_network:
    driver: bridge
